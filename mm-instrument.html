<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>M&M Instrument</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=DM+Mono:wght@300;400;500&family=Playfair+Display:ital,wght@0,400;1,400&display=swap');
  :root{
    --bg:#080808;--surface:#111;--border:#1e1e1e;--accent:#e8d5a3;
    --accent2:#c4a882;--text:#e8e8e8;--muted:#444;--green:#4caf7d;--red:#c0392b;
  }
  *{margin:0;padding:0;box-sizing:border-box}
  body{background:var(--bg);color:var(--text);font-family:'DM Mono',monospace;min-height:100vh;display:flex;flex-direction:column;align-items:center;padding:40px 20px}
  header{text-align:center;margin-bottom:36px}
  .eyebrow{font-size:9px;letter-spacing:.35em;color:var(--accent);text-transform:uppercase;margin-bottom:12px;opacity:.6}
  h1{font-family:'Playfair Display',serif;font-size:42px;font-weight:400;letter-spacing:-.02em}
  h1 em{font-style:italic;color:var(--accent)}
  .wrap{width:100%;max-width:680px}

  /* Upload */
  .upload-zone{border:1px dashed #2a2a2a;padding:32px;text-align:center;cursor:pointer;transition:border-color .2s;margin-bottom:3px}
  .upload-zone:hover{border-color:var(--accent)}
  .upload-zone input{display:none}
  .upload-label{font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
  .upload-name{font-size:11px;color:var(--accent);margin-top:8px;letter-spacing:.08em}

  /* Waveform */
  .waveform-wrap{background:var(--surface);border:1px solid var(--border);margin-bottom:3px;position:relative;overflow:hidden}
  canvas{display:block;width:100%;height:80px}
  .playhead{position:absolute;top:0;bottom:0;width:1px;background:var(--accent);pointer-events:none;transition:none}

  /* Controls */
  .controls{display:grid;grid-template-columns:1fr 1fr;gap:3px;margin-bottom:3px}
  .control-block{background:var(--surface);border:1px solid var(--border);padding:16px}
  .ctrl-label{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);opacity:.6;margin-bottom:10px}
  .slider-row{display:flex;align-items:center;gap:10px;margin-bottom:8px}
  .slider-name{font-size:9px;color:var(--muted);width:60px;letter-spacing:.05em}
  input[type=range]{flex:1;-webkit-appearance:none;height:2px;background:#222;outline:none;cursor:pointer}
  input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;background:var(--accent);border-radius:50%}
  .slider-val{font-size:9px;color:var(--accent);width:36px;text-align:right;letter-spacing:.05em}

  /* Pads */
  .pads-wrap{background:var(--surface);border:1px solid var(--border);padding:16px;margin-bottom:3px}
  .pads-label{font-size:8px;letter-spacing:.28em;text-transform:uppercase;color:var(--accent);opacity:.6;margin-bottom:12px}
  .pads{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
  .pad{background:#0a0a0a;border:1px solid #1a1a1a;padding:0;aspect-ratio:1;cursor:pointer;font-family:'DM Mono',monospace;font-size:8px;color:var(--muted);letter-spacing:.05em;transition:all .08s;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;user-select:none}
  .pad:hover{border-color:#333;color:var(--text)}
  .pad.active{background:var(--accent);color:#000;border-color:var(--accent)}
  .pad .note{font-size:10px;font-weight:500}
  .pad .semi{font-size:7px;opacity:.7}

  /* Transport */
  .transport{display:flex;gap:3px;margin-bottom:3px}
  .btn{flex:1;background:var(--surface);border:1px solid var(--border);padding:12px;cursor:pointer;font-family:'DM Mono',monospace;font-size:9px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);transition:all .15s}
  .btn:hover{border-color:var(--accent);color:var(--accent)}
  .btn.active{background:var(--accent);color:#000;border-color:var(--accent)}
  .btn.danger{border-color:#2a1010}
  .btn.danger:hover{border-color:var(--red);color:var(--red)}

  /* Loop */
  .loop-wrap{background:var(--surface);border:1px solid var(--border);padding:14px;margin-bottom:3px}
  .loop-bar{height:6px;background:#0a0a0a;border:1px solid #1a1a1a;position:relative;cursor:crosshair;margin-top:10px}
  .loop-region{position:absolute;top:0;bottom:0;background:rgba(232,213,163,.15);border-left:1px solid var(--accent);border-right:1px solid var(--accent)}
  .loop-handle{position:absolute;top:-4px;bottom:-4px;width:3px;background:var(--accent);cursor:ew-resize}

  .status{font-size:9px;color:var(--muted);letter-spacing:.12em;text-align:center;padding:12px 0}
  
  @keyframes pulse{0%,100%{opacity:.4}50%{opacity:1}}
  .recording{animation:pulse .8s ease-in-out infinite;color:var(--red)}
  
  @media(max-width:480px){.controls{grid-template-columns:1fr}.pads{grid-template-columns:repeat(4,1fr)}}
</style>
</head>
<body>
<header>
  <p class="eyebrow">MorAIs &amp; Moreira</p>
  <h1>M<em>&amp;</em>M <em>Instrument</em></h1>
</header>
<div class="wrap">

  <!-- Upload -->
  <div class="upload-zone" onclick="document.getElementById('fileInput').click()">
    <input type="file" id="fileInput" accept="audio/*,video/*"/>
    <div class="upload-label">Drop or click to load sample</div>
    <div class="upload-name" id="fileName">No sample loaded</div>
  </div>

  <!-- Waveform -->
  <div class="waveform-wrap">
    <canvas id="waveCanvas" height="80"></canvas>
    <div class="playhead" id="playhead" style="left:0;display:none"></div>
  </div>

  <!-- Controls -->
  <div class="controls">
    <div class="control-block">
      <div class="ctrl-label">Playback</div>
      <div class="slider-row">
        <span class="slider-name">Speed</span>
        <input type="range" id="speed" min="0.25" max="3" step="0.05" value="1">
        <span class="slider-val" id="speedVal">1.00x</span>
      </div>
      <div class="slider-row">
        <span class="slider-name">Volume</span>
        <input type="range" id="volume" min="0" max="2" step="0.05" value="1">
        <span class="slider-val" id="volumeVal">1.00</span>
      </div>
      <div class="slider-row">
        <span class="slider-name">Reverse</span>
        <input type="range" id="reverse" min="0" max="1" step="1" value="0">
        <span class="slider-val" id="reverseVal">Off</span>
      </div>
    </div>
    <div class="control-block">
      <div class="ctrl-label">Tone</div>
      <div class="slider-row">
        <span class="slider-name">Low</span>
        <input type="range" id="bass" min="-20" max="20" step="1" value="0">
        <span class="slider-val" id="bassVal">0 dB</span>
      </div>
      <div class="slider-row">
        <span class="slider-name">Mid</span>
        <input type="range" id="mid" min="-20" max="20" step="1" value="0">
        <span class="slider-val" id="midVal">0 dB</span>
      </div>
      <div class="slider-row">
        <span class="slider-name">High</span>
        <input type="range" id="treble" min="-20" max="20" step="1" value="0">
        <span class="slider-val" id="trebleVal">0 dB</span>
      </div>
    </div>
  </div>

  <!-- Loop -->
  <div class="loop-wrap">
    <div class="ctrl-label">Loop Region</div>
    <div class="loop-bar" id="loopBar">
      <div class="loop-region" id="loopRegion" style="left:0%;width:100%"></div>
      <div class="loop-handle" id="loopStart" style="left:0%"></div>
      <div class="loop-handle" id="loopEnd" style="left:100%"></div>
    </div>
  </div>

  <!-- Pads -->
  <div class="pads-wrap">
    <div class="pads-label">Pitch Pads — click or use keys 1–8</div>
    <div class="pads" id="pads"></div>
  </div>

  <!-- Transport -->
  <div class="transport">
    <button class="btn" id="btnPlay" onclick="togglePlay()">▶ Play</button>
    <button class="btn" id="btnLoop" onclick="toggleLoop()">⟳ Loop Off</button>
    <button class="btn danger" onclick="stopAll()">■ Stop</button>
  </div>

  <div class="status" id="status">Load a sample to begin</div>
</div>

<script>
let ctx, audioBuffer, gainNode, bassFilter, midFilter, trebleFilter;
let activeSource = null;
let isPlaying = false;
let loopEnabled = false;
let isReversed = false;
let loopStart = 0, loopEnd = 1;
let startTime = 0, startOffset = 0;
let animFrame;

const notes = [
  {label:'C', semi:-12, key:'1'},
  {label:'D', semi:-9,  key:'2'},
  {label:'E', semi:-7,  key:'3'},
  {label:'F', semi:-5,  key:'4'},
  {label:'G', semi:-3,  key:'5'},
  {label:'A', semi:0,   key:'6'},
  {label:'B', semi:2,   key:'7'},
  {label:'C\'',semi:3,  key:'8'},
];

// Build pads
const padsEl = document.getElementById('pads');
notes.forEach((n, i) => {
  const pad = document.createElement('div');
  pad.className = 'pad';
  pad.id = `pad${i}`;
  pad.innerHTML = `<span class="note">${n.label}</span><span class="semi">${n.key}</span>`;
  pad.addEventListener('mousedown', () => triggerPad(i));
  pad.addEventListener('touchstart', e => { e.preventDefault(); triggerPad(i); });
  padsEl.appendChild(pad);
});

// Key bindings
document.addEventListener('keydown', e => {
  const idx = parseInt(e.key) - 1;
  if (idx >= 0 && idx < 8 && audioBuffer) triggerPad(idx);
  if (e.key === ' ') { e.preventDefault(); togglePlay(); }
});

// File load — handles both audio and video files including .mov on iOS
document.getElementById('fileInput').addEventListener('change', async e => {
  const file = e.target.files[0];
  if (!file) return;
  document.getElementById('fileName').textContent = file.name;
  document.getElementById('status').textContent = 'Loading...';
  if (!ctx) initAudio();

  try {
    // Try direct decoding first (works for most audio files)
    const ab = await file.arrayBuffer();
    audioBuffer = await ctx.decodeAudioData(ab);
    drawWaveform();
    document.getElementById('status').textContent = `Loaded · ${audioBuffer.duration.toFixed(1)}s · ${audioBuffer.sampleRate}Hz`;
    stopAll();
  } catch(err) {
    // Fallback: use video/audio element for formats Safari can't decode directly (e.g. .mov)
    document.getElementById('status').textContent = 'Trying video decode...';
    try {
      await loadViaMediaElement(file);
    } catch(err2) {
      document.getElementById('status').textContent = 'Could not load file. Try a .mp3, .wav or .m4a file.';
    }
  }
});

async function loadViaMediaElement(file) {
  return new Promise((resolve, reject) => {
    const url = URL.createObjectURL(file);
    const media = document.createElement('video');
    media.src = url;
    media.crossOrigin = 'anonymous';
    media.preload = 'auto';

    media.addEventListener('error', () => reject(new Error('Media error')));
    media.addEventListener('canplaythrough', async () => {
      try {
        if (!ctx) initAudio();
        const source = ctx.createMediaElementSource(media);
        // Route through our effects chain
        source.connect(bassFilter);
        media.play();

        // Also decode for waveform display — try with a short timeout
        try {
          const ab = await fetch(url).then(r => r.arrayBuffer());
          audioBuffer = await ctx.decodeAudioData(ab);
          drawWaveform();
          document.getElementById('status').textContent = `Loaded · ${audioBuffer.duration.toFixed(1)}s`;
        } catch(e) {
          document.getElementById('status').textContent = 'Loaded (waveform unavailable for this format)';
        }
        URL.revokeObjectURL(url);
        resolve();
      } catch(err) {
        reject(err);
      }
    });
  });
}

function initAudio() {
  ctx = new (window.AudioContext || window.webkitAudioContext)();
  gainNode = ctx.createGain();
  bassFilter = ctx.createBiquadFilter();
  bassFilter.type = 'lowshelf';
  bassFilter.frequency.value = 200;
  midFilter = ctx.createBiquadFilter();
  midFilter.type = 'peaking';
  midFilter.frequency.value = 1000;
  midFilter.Q.value = 0.8;
  trebleFilter = ctx.createBiquadFilter();
  trebleFilter.type = 'highshelf';
  trebleFilter.frequency.value = 4000;
  bassFilter.connect(midFilter);
  midFilter.connect(trebleFilter);
  trebleFilter.connect(gainNode);
  gainNode.connect(ctx.destination);
}

function createSource(rate = 1, semitone = 0) {
  if (!ctx || !audioBuffer) return null;
  const src = ctx.createBufferSource();
  let buf = audioBuffer;
  if (isReversed) {
    const rev = ctx.createBuffer(buf.numberOfChannels, buf.length, buf.sampleRate);
    for (let ch = 0; ch < buf.numberOfChannels; ch++) {
      const data = buf.getChannelData(ch).slice().reverse();
      rev.copyToChannel(data, ch);
    }
    buf = rev;
  }
  src.buffer = buf;
  src.playbackRate.value = rate * Math.pow(2, semitone / 12);
  src.loop = loopEnabled;
  src.loopStart = loopStart * audioBuffer.duration;
  src.loopEnd = loopEnd * audioBuffer.duration;
  src.connect(bassFilter);
  return src;
}

function play(semitone = 0, oneshot = false) {
  if (!audioBuffer) return;
  if (ctx.state === 'suspended') ctx.resume();
  if (activeSource && !oneshot) {
    activeSource.stop();
    activeSource = null;
  }
  const rate = parseFloat(document.getElementById('speed').value);
  const src = createSource(rate, semitone);
  if (!src) return;
  const offset = loopStart * audioBuffer.duration;
  src.start(0, offset);
  if (!loopEnabled) src.onended = () => { isPlaying = false; document.getElementById('btnPlay').textContent = '▶ Play'; };
  if (!oneshot) { activeSource = src; isPlaying = true; startTime = ctx.currentTime; startOffset = offset; }
  return src;
}

function triggerPad(idx) {
  if (!audioBuffer) return;
  const pad = document.getElementById(`pad${idx}`);
  pad.classList.add('active');
  setTimeout(() => pad.classList.remove('active'), 120);
  const src = play(notes[idx].semi, true);
  if (src) src.onended = () => {};
}

function togglePlay() {
  if (!audioBuffer) return;
  if (isPlaying) {
    if (activeSource) activeSource.stop();
    activeSource = null;
    isPlaying = false;
    document.getElementById('btnPlay').textContent = '▶ Play';
    cancelAnimationFrame(animFrame);
    document.getElementById('playhead').style.display = 'none';
  } else {
    play(0);
    document.getElementById('btnPlay').textContent = '❚❚ Pause';
    animatePlayhead();
    document.getElementById('playhead').style.display = 'block';
  }
}

function toggleLoop() {
  loopEnabled = !loopEnabled;
  document.getElementById('btnLoop').textContent = loopEnabled ? '⟳ Loop On' : '⟳ Loop Off';
  document.getElementById('btnLoop').classList.toggle('active', loopEnabled);
  if (activeSource) activeSource.loop = loopEnabled;
}

function stopAll() {
  if (activeSource) { try { activeSource.stop(); } catch(e) {} activeSource = null; }
  isPlaying = false;
  document.getElementById('btnPlay').textContent = '▶ Play';
  cancelAnimationFrame(animFrame);
  document.getElementById('playhead').style.display = 'none';
}

function animatePlayhead() {
  if (!isPlaying || !audioBuffer) return;
  const elapsed = ctx.currentTime - startTime;
  const duration = audioBuffer.duration;
  const rate = parseFloat(document.getElementById('speed').value);
  let pos = (startOffset + elapsed * rate) / duration;
  if (loopEnabled) pos = loopStart + ((pos - loopStart) % (loopEnd - loopStart));
  pos = Math.min(Math.max(pos, 0), 1);
  const canvas = document.getElementById('waveCanvas');
  document.getElementById('playhead').style.left = (pos * canvas.offsetWidth) + 'px';
  animFrame = requestAnimationFrame(animatePlayhead);
}

function drawWaveform() {
  const canvas = document.getElementById('waveCanvas');
  canvas.width = canvas.offsetWidth * window.devicePixelRatio;
  canvas.height = 80 * window.devicePixelRatio;
  const ctx2 = canvas.getContext('2d');
  ctx2.scale(window.devicePixelRatio, window.devicePixelRatio);
  const w = canvas.offsetWidth, h = 80;
  ctx2.fillStyle = '#111';
  ctx2.fillRect(0, 0, w, h);
  const data = audioBuffer.getChannelData(0);
  const step = Math.ceil(data.length / w);
  ctx2.beginPath();
  ctx2.strokeStyle = '#e8d5a3';
  ctx2.lineWidth = 1;
  for (let i = 0; i < w; i++) {
    let min = 1, max = -1;
    for (let j = 0; j < step; j++) {
      const v = data[i * step + j] || 0;
      if (v < min) min = v;
      if (v > max) max = v;
    }
    ctx2.moveTo(i, (1 + min) * h / 2);
    ctx2.lineTo(i, (1 + max) * h / 2);
  }
  ctx2.stroke();
}

// Sliders
function setupSlider(id, valId, format, onChange) {
  const el = document.getElementById(id);
  const val = document.getElementById(valId);
  el.addEventListener('input', () => {
    val.textContent = format(el.value);
    onChange(parseFloat(el.value));
  });
}

setupSlider('speed', 'speedVal', v => parseFloat(v).toFixed(2) + 'x', v => { if (activeSource) activeSource.playbackRate.value = v; });
setupSlider('volume', 'volumeVal', v => parseFloat(v).toFixed(2), v => { if (gainNode) gainNode.gain.value = v; });
setupSlider('reverse', 'reverseVal', v => v == 1 ? 'On' : 'Off', v => { isReversed = v == 1; });
setupSlider('bass', 'bassVal', v => (v >= 0 ? '+' : '') + v + ' dB', v => { if (bassFilter) bassFilter.gain.value = v; });
setupSlider('mid', 'midVal', v => (v >= 0 ? '+' : '') + v + ' dB', v => { if (midFilter) midFilter.gain.value = v; });
setupSlider('treble', 'trebleVal', v => (v >= 0 ? '+' : '') + v + ' dB', v => { if (trebleFilter) trebleFilter.gain.value = v; });

// Loop handles
let dragging = null;
const loopBar = document.getElementById('loopBar');

function setLoopVisual() {
  document.getElementById('loopRegion').style.left = (loopStart * 100) + '%';
  document.getElementById('loopRegion').style.width = ((loopEnd - loopStart) * 100) + '%';
  document.getElementById('loopStart').style.left = (loopStart * 100) + '%';
  document.getElementById('loopEnd').style.left = (loopEnd * 100) + '%';
}

['loopStart', 'loopEnd'].forEach(id => {
  const el = document.getElementById(id);
  el.addEventListener('mousedown', e => { dragging = id; e.preventDefault(); });
  el.addEventListener('touchstart', e => { dragging = id; e.preventDefault(); });
});

document.addEventListener('mousemove', e => {
  if (!dragging) return;
  const rect = loopBar.getBoundingClientRect();
  let pos = (e.clientX - rect.left) / rect.width;
  pos = Math.min(Math.max(pos, 0), 1);
  if (dragging === 'loopStart') loopStart = Math.min(pos, loopEnd - 0.05);
  if (dragging === 'loopEnd') loopEnd = Math.max(pos, loopStart + 0.05);
  setLoopVisual();
  if (activeSource) { activeSource.loopStart = loopStart * (audioBuffer?.duration || 1); activeSource.loopEnd = loopEnd * (audioBuffer?.duration || 1); }
});

document.addEventListener('mouseup', () => dragging = null);
document.addEventListener('touchend', () => dragging = null);
document.addEventListener('touchmove', e => {
  if (!dragging) return;
  const rect = loopBar.getBoundingClientRect();
  let pos = (e.touches[0].clientX - rect.left) / rect.width;
  pos = Math.min(Math.max(pos, 0), 1);
  if (dragging === 'loopStart') loopStart = Math.min(pos, loopEnd - 0.05);
  if (dragging === 'loopEnd') loopEnd = Math.max(pos, loopStart + 0.05);
  setLoopVisual();
});

window.addEventListener('resize', () => { if (audioBuffer) drawWaveform(); });
</script>
</body>
</html>
